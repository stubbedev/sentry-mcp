name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o sentry-mcp .

      - name: Smoke — tools/list
        run: |
          # The official MCP SDK requires the initialize handshake before any
          # request. The trailing sleep holds stdin open so the server flushes
          # its responses before EOF tears the stdio transport down.
          OUT="$({ printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; sleep 1; } \
            | SENTRY_URL=https://smoke.invalid SENTRY_AUTH_TOKEN=smoke SENTRY_ORG_SLUG=smoke ./sentry-mcp)"
          echo "$OUT" | node -e '
            let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
              const r=d.trim().split("\n").map(l=>JSON.parse(l)).find(m=>m.id===2);
              if(!r)throw new Error("no tools/list response");
              if(r.error)throw new Error("server error: "+r.error.message);
              const t=r.result?.tools;
              if(!Array.isArray(t)||!t.length)throw new Error("no tools in response");
              const bad=t.filter(x=>!x.name||!x.inputSchema);
              if(bad.length)throw new Error("malformed tools: "+bad.map(x=>x.name??"(unnamed)").join(", "));
              console.log("smoke OK — "+t.length+" tool(s): "+t.map(x=>x.name).join(", "));
            });'
